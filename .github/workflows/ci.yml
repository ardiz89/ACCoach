name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# I test leggono il repo e basta: nessun token che possa scriverci.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # La versione entra da `env:`: un'espressione dentro `run:` e' testo
        # incollato nello script prima che giri.
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          if ($env:PY_VERSION -eq "3.12") {
            # Senza aggiornare pip: un pip preso al volo aggirerebbe il lock.
            pip install --require-hashes -r requirements.lock
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            pip install pytest
          } else {
            python -m pip install --upgrade pip
            pip install -r requirements.txt pytest
          }

      - name: Run tests
        run: python -m pytest -q
