name: Idea or request
description: Something HONE could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation on track or in the analysis, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: sim
    attributes:
      label: Game
      options:
        - Assetto Corsa Competizione
        - Assetto Corsa
        - Both
